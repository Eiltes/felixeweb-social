name: FelixeWeb Hub heartbeat
# Calls the site's WordPress cron every 5 minutes so the Hub syncs mail,
# sends due follow-ups and fires phone alerts even when nobody visits the site.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run WordPress cron
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "https://felixeweb.com/wp-cron.php?doing_wp_cron=$(date +%s)")
          echo "wp-cron responded $code"
